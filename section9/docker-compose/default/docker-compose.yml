services:
#  rabbit:
#   image: rabbitmq:3.13-management
#   hostname: rabbitmq
#   ports:
#   - "5672:5672"
#   - "15672:15672"
#   healthcheck:
#    test: rabbitmq-diagnostics check_port_connectivity
#    interval: 10s
#    timeout: 5s
#    retries: 10
#    start_period: 10s
#   extends:
#    file: common-config.yml
#    service: network-deploy-service

  configserver:
   image: "sriharshakr/configserver:s9"
   container_name: configserver-ms
   ports:
   - "8071:8071"
#   depends_on: 
#    rabbit:
#     condition: service_healthy
   healthcheck:
    test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s
   extends:
    file: common-config.yml
    service: microservice-base-config

  eurekaserver:
   image: "sriharshakr/eurekaserver:s9"
   container_name: eurekaserver-ms
   ports:
   - "8070:8070"
   depends_on: 
    configserver:
     condition: service_healthy
   environment:
    SPRING_APPLICATION_NAME: "eurekaserver"
   healthcheck:
    test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s
   extends:
    file: common-config.yml
    service: microservice-configserver-config

  accounts:
    image: "sriharshakr/accounts:s9"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    depends_on:
     configserver:
      condition: service_healthy
     eurekaserver:
      condition: service_healthy
    healthcheck:
     test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
     interval: 20s
     timeout: 10s
     retries: 24
     start_period: 30s
    environment:
     SPRING_APPLICATION_NAME: "accounts"
    extends:
     file: common-config.yml
     service: microservice-eureka-config

  loans:
    image: "sriharshakr/loans:s9"
    container_name: loans-ms
    ports:
      - "8090:8090"		
    depends_on:
     configserver:
      condition: service_healthy
     eurekaserver:
      condition: service_healthy
    healthcheck:
     test: "curl --fail --silent localhost:8090/actuator/health/readiness | grep UP || exit 1"
     interval: 20s
     timeout: 10s
     retries: 24
     start_period: 30s
    environment:
     SPRING_APPLICATION_NAME: "loans"
    extends:
     file: common-config.yml
     service: microservice-eureka-config

  cards:
    image: "sriharshakr/cards:s9"
    container_name: cards-ms
    ports:
      - "9000:9000"
    depends_on:
     configserver:
      condition: service_healthy
     eurekaserver:
      condition: service_healthy
    healthcheck:
     test: "curl --fail --silent localhost:9000/actuator/health/readiness | grep UP || exit 1"
     interval: 20s
     timeout: 10s
     retries: 24
     start_period: 30s
    environment:
     SPRING_APPLICATION_NAME: "cards"
    extends:
     file: common-config.yml
     service: microservice-eureka-config

  gatewayserver:
   image: "sriharshakr/gatewayserver:s9"
   container_name: gatewayserver-ms
   ports:
     - "8072:8072"
   depends_on:
    accounts:
     condition: service_healthy
    cards:
     condition: service_healthy
    loans:
     condition: service_healthy
#   healthcheck:
#    test: "curl --fail --silent localhost:8072/actuator/health/readiness | grep UP || exit 1"
#    interval: 10s
#    timeout: 5s
#    retries: 10
#    start_period: 10s
   environment:
    SPRING_APPLICATION_NAME: "gatewayserver"
   extends:
    file: common-config.yml
    service: microservice-eureka-config

networks:
  eazybank:
    driver: "bridge"